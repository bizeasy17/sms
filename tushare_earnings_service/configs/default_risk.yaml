data:
  # Local prepare source (same DB as earnings service)
  db_url: postgresql+psycopg2://postgres:postgres@localhost:5432/smartinvestor_earnings_uat
  # earnings service 本地财务库（raw JSON + snapshot）
  financial_db_url: postgresql+psycopg2://postgres:postgres@localhost:5432/smartinvestor_earnings_uat
  # ETL source tables for sync_market_local command.
  etl_db_url: postgresql+psycopg2://postgres:postgres@localhost:5432/smartinvestor_etl_dev
  etl_trading_table: stockdata_stocktradinghistory
  etl_fundamental_table: stockdata_stockfundamentalhistory
  etl_corporation_table: stockdata_corporation
  etl_industry_table: stockdata_industry
  # Local mirror tables used by prepare pipeline.
  trading_table: earnings_mkt_trading_history
  fundamental_table: earnings_mkt_fundamental_history
  # Legacy mixed table disabled. Raw financial records are stored one-endpoint-one-table.
  financial_table: null
  financial_endpoint_tables:
    income: earnings_fin_income
    balancesheet_vip: earnings_fin_balancesheet_vip
    cashflow_vip: earnings_fin_cashflow_vip
    forecast_vip: earnings_fin_forecast_vip
    express_vip: earnings_fin_express_vip
    dividend: earnings_fin_dividend
    fina_indicator_vip: earnings_fin_fina_indicator_vip
    fina_audit: earnings_fin_fina_audit
    fina_mainbz_vip: earnings_fin_fina_mainbz_vip
    disclosure_date: earnings_fin_disclosure_date
  financial_feature_table: earnings_financial_feature_panel
  industry_map_table: earnings_dim_corporation
  industry_dim_table: earnings_dim_industry
  start_date: 2018-01-01
  end_date: null
  financial_cache_dir: c:/Users/HANJ29/Development/code/sms/smartinvestor_etl/analysis/financial_cache
  freq: D
  scope_prefixes: ["60", "00", "30", "68"]

feature:
  lookback_days: 20
  min_history_rows: 120
  use_financial_feature_snapshot: true
  use_financial_db: true
  use_financial_cache: true
  prepare_sampling:
    enabled: true
    # Keep per-symbol recent 5 years reports in panel before asof join.
    recent_years_per_symbol: 5
    # Cap panel rows by report_type for memory-safe prepare.
    max_rows_per_report_type: 100000
    report_types: [Q1, H1, Q3, FY]

label:
  horizon_days: 20
  fy_value_col: n_income
  reg_target: target_fy_value_yoy
  cls_target: target_fy_up
  exclude_fy_rows_for_training: true
  risk:
    enabled: true
    horizon_days: 20
    min_periods: 10
    # Normalize future max drawdown and realized volatility into a 0-100 risk score.
    severe_drawdown: 0.20
    severe_volatility: 0.05
    weight_drawdown: 0.7
    weight_volatility: 0.3
    score_bands:
      - max: 35
        level: LOW
        code: 0
      - max: 65
        level: MEDIUM
        code: 1
      - max: 100
        level: HIGH
        code: 2

train:
  train_end_date: 2023-12-31
  random_state: 42
  # Optional: set to Q1/H1/Q3/FY to train one split dataset shard.
  report_type: null
  model_name: earnings_forecast_risk
  model_version: null
  promote_to_production: false
  # Supported: hgb, rf
  classifier_algo: hgb
  regressor_algo: hgb
  industry_classifier_algo: hgb
  industry_regressor_algo: hgb
  industry_eval_min_samples: 120
  use_industry_models: true
  industry_train_min_rows: 240
  industry_reg_min_rows: 80
  stock_median_lookback_years: 3

output:
  dir: c:/Users/HANJ29/Development/web/UAT/tushare_earnings_service/outputs_risk
  use_dataset_versioning: false
  auto_dataset_version: false
  dataset_version: null
  dataset_versions_dir: datasets
  model_versions_dir: model_versions
  model_registry_file: model_registry.jsonl
  serving_pointer_file: serving.yaml
  dataset_file: dataset_risk.parquet
  # Also persist report-type shards: dataset_Q1.parquet / dataset_H1.parquet / ...
  split_dataset_by_report_type: true
  split_dataset_dir: datasets_by_report_type_risk
  # Hard cap rows for each split dataset file.
  split_max_rows_per_report_type: 100000
  # Optional explicit order/filter, e.g. [Q1, H1, Q3, FY]
  split_report_types: []
  model_file: models_risk.joblib
  metrics_file: metrics_risk.json

valuation_mapping:
  rules_version: v1
  weight_prob: 0.7
  weight_earnings: 0.3
  earnings_growth_min: -0.3
  earnings_growth_max: 0.3
  quality_risk_guard:
    enabled: true
    min_revenue_base: 1000000
    max_score_penalty: 30
    max_risk_upgrade: 2
    thresholds:
      min_ocf_to_or: 0.00
      min_positive_profit: 0.0
      max_negative_operating_cashflow: 0.0
      max_receiv_to_revenue: 0.45
      max_inventory_to_revenue: 0.60
    rules:
      ocf_to_or_low:
        score_penalty: 8
        risk_upgrade: 1
      profit_cashflow_mismatch:
        score_penalty: 10
        risk_upgrade: 1
      receivables_ratio_high:
        score_penalty: 6
        risk_upgrade: 1
      inventory_ratio_high:
        score_penalty: 6
        risk_upgrade: 1
  score_bands:
    - min: 70
      stance: STRONG_BUY
      confidence: HIGH
    - min: 60
      stance: BUY
      confidence: MEDIUM
    - min: 45
      stance: HOLD
      confidence: MEDIUM
    - min: 30
      stance: REDUCE
      confidence: LOW
    - min: 0
      stance: SELL
      confidence: LOW
